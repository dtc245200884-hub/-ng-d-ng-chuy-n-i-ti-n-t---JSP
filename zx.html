    <div class="container">
        <h1>CHUYỂN ĐỔI TIỀN TỆ</h1>
        <p>Nhập thông tin để chuyển đổi USD sang VNĐ</p>

        <form action="converter.jsp" method="post">
            <label for="rate">Tỉ giá (VND/USD):</label>
            <input type="number" id="rate" name="rate"
                   value="25000" min="0.01" step="any" required>

            <label for="usd">Lượng USD:</label>
            <input type="number" id="usd" name="usd"
                   min="0" step="any" placeholder="Nhập số USD" required>

            <button type="submit">Chuyển đổi</button>
        </form>
    </div>
</body>
